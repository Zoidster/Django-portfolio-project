{% extends "portfolio_app/base_template.html" %}

{% block content %}

<h2>Active Student Portfolios</h2>

<ul>
    {% for portfolio in active_portfolios %}        <!--for tag itterates through, every portfolio thats active as requested in the ORM in the linked view-->
    <li>{{ portfolio.title }}</li>                  <!--a member variable of portfolio-->
    {% empty %}                                     <!--if collection is empty, no record-->
    <li>No active portfolios found.</li>            <!--dispaly if empty-->
    {% endfor %}                                    <!--end of the for loop tag thing-->
</ul>


<a href="{% url 'index' %}">Home</a>                <!--link made using the urls.py url path path function-->
{% endblock %}
